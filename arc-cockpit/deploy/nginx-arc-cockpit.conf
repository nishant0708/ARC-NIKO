# ARC cockpit: static web app + /graphql proxied to the Node server on 127.0.0.1:4000.
# certbot adds the HTTPS (443) server block and the HTTP -> HTTPS redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    root @COCKPIT_DIR@/web/dist;
    index index.html;

    # Everyone must log in: the cockpit shows commercial data.
    auth_basic "ARC Cockpit";
    auth_basic_user_file /etc/nginx/arc-cockpit.htpasswd;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Let's Encrypt must reach its challenge files without the password
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location /graphql {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build files never change: cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: every screen URL serves index.html (never cached, so updates show at once)
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
